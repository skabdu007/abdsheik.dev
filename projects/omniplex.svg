<svg width="800" height="480" viewBox="0 0 800 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="480" fill="#070A14"/>
  <circle cx="250" cy="180" r="260" fill="url(#omni_glow)" opacity="0.35"/>
  <circle cx="600" cy="300" r="220" fill="url(#omni_glow_purple)" opacity="0.25"/>

  <!-- Grid lines -->
  <path d="M0 80H800M0 160H800M0 240H800M0 320H800M0 400H800" stroke="#1E293B" stroke-opacity="0.35" stroke-width="1"/>

  <!-- Payment Orchestration Frame -->
  <rect x="60" y="50" width="680" height="380" rx="14" fill="#0C1222" stroke="#334155" stroke-opacity="0.6" stroke-width="1.5"/>
  <rect x="60" y="50" width="680" height="42" rx="14" fill="#0F172A"/>
  <circle cx="88" cy="71" r="5" fill="#EF4444"/>
  <circle cx="106" cy="71" r="5" fill="#F59E0B"/>
  <circle cx="124" cy="71" r="5" fill="#10B981"/>
  <text x="146" y="75" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">OmniPlex — Smart Payment Gateway Routing &amp; Vault</text>

  <!-- Credit Card Visual Representation -->
  <g transform="translate(90, 115)">
    <rect width="280" height="160" rx="12" fill="url(#card_grad)" stroke="#475569" stroke-width="1"/>
    <circle cx="40" cy="40" r="14" fill="#EF4444" fill-opacity="0.8"/>
    <circle cx="58" cy="40" r="14" fill="#F59E0B" fill-opacity="0.8"/>
    <rect x="25" y="75" width="35" height="24" rx="4" fill="#E2E8F0" fill-opacity="0.7"/>
    <text x="25" y="125" fill="#FFFFFF" font-family="monospace" font-size="14" letter-spacing="2">•••• •••• •••• 9428</text>
    <text x="25" y="145" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="10">ALEXANDER CHEN</text>
    <text x="220" y="145" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="10">09/29</text>
  </g>

  <!-- Routing Flowchart -->
  <g transform="translate(410, 115)">
    <rect x="0" y="0" width="300" height="280" rx="10" fill="#0A0F1E" stroke="#1E293B"/>
    <text x="20" y="30" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">SMART ROUTER DISPATCH</text>

    <!-- Node 1 -->
    <rect x="20" y="50" width="120" height="38" rx="6" fill="#1E293B" stroke="#3B82F6"/>
    <text x="32" y="73" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="11">US Primary (Visa)</text>

    <!-- Arrow -->
    <path d="M140 69H170" stroke="#60A5FA" stroke-width="2" stroke-dasharray="3 3"/>
    <rect x="170" y="55" width="110" height="28" rx="4" fill="#14532D" stroke="#15803D"/>
    <text x="180" y="73" fill="#86EFAC" font-family="system-ui, sans-serif" font-size="10">99.8% Success</text>

    <!-- Node 2 -->
    <rect x="20" y="105" width="120" height="38" rx="6" fill="#1E293B" stroke="#8B5CF6"/>
    <text x="32" y="128" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="11">EU SEPA Rail</text>

    <path d="M140 124H170" stroke="#A855F7" stroke-width="2" stroke-dasharray="3 3"/>
    <rect x="170" y="110" width="110" height="28" rx="4" fill="#14532D" stroke="#15803D"/>
    <text x="180" y="128" fill="#86EFAC" font-family="system-ui, sans-serif" font-size="10">Instant Settle</text>

    <!-- Tokenization Vault Status -->
    <rect x="20" y="165" width="260" height="95" rx="6" fill="#0F172A" stroke="#334155"/>
    <text x="32" y="190" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">PCI-DSS TOKEN VAULT</text>
    <text x="32" y="214" fill="#34D399" font-family="monospace" font-size="10">TOK_SECURE_sha256_d8924f...</text>
    <text x="32" y="238" fill="#64748B" font-family="system-ui, sans-serif" font-size="10">Zero plain-text storage · AES-256-GCM</text>
  </g>

  <!-- Bottom Metric -->
  <g transform="translate(90, 305)">
    <rect width="280" height="90" rx="8" fill="#0E1626" stroke="#1E293B"/>
    <text x="18" y="26" fill="#64748B" font-family="system-ui, sans-serif" font-size="10" font-weight="600">AVG PROCESSING LATENCY</text>
    <text x="18" y="60" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="28" font-weight="700">84ms</text>
    <text x="130" y="60" fill="#34D399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">P99 SLA Guaranteed</text>
  </g>

  <defs>
    <radialGradient id="omni_glow" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#2563EB"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="omni_glow_purple" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#9333EA"/>
      <stop offset="1" stop-color="#9333EA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card_grad" x1="0" y1="0" x2="280" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
</svg>
