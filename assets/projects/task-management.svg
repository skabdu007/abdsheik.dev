<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="taskBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091122" />
      <stop offset="50%" stop-color="#0e172e" />
      <stop offset="100%" stop-color="#050816" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#taskBg)" />
  <rect x="1" y="1" width="798" height="498" rx="15" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.5" />

  <g transform="translate(35, 35)">
    <rect width="730" height="430" rx="12" fill="#0b1021" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    <path d="M 0 38 L 730 38" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    <circle cx="20" cy="19" r="4.5" fill="#ef4444" />
    <circle cx="36" cy="19" r="4.5" fill="#f59e0b" />
    <circle cx="52" cy="19" r="4.5" fill="#10b981" />
    <text x="365" y="23" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">flowtask.app · React Context API + LocalStorage</text>

    <!-- Header bar -->
    <text x="24" y="74" fill="#ffffff" font-family="Inter, sans-serif" font-size="16" font-weight="bold">Product Sprint Board</text>
    <rect x="580" y="56" width="126" height="28" rx="14" fill="#38bdf8" />
    <text x="643" y="74" fill="#050816" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">+ New Task</text>

    <!-- Kanban Columns -->
    <g transform="translate(24, 100)">
      <!-- Col 1: To Do -->
      <rect x="0" y="0" width="216" height="300" rx="8" fill="#080c1b" stroke="rgba(255, 255, 255, 0.05)" />
      <text x="14" y="24" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11" font-weight="bold">TO DO (3)</text>

      <!-- Task Card 1 -->
      <rect x="10" y="38" width="196" height="74" rx="6" fill="#111a33" stroke="rgba(255, 255, 255, 0.06)" />
      <rect x="20" y="48" width="44" height="14" rx="3" fill="#38bdf8" opacity="0.2" />
      <text x="42" y="59" fill="#38bdf8" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">FEATURE</text>
      <text x="20" y="78" fill="#ffffff" font-family="Inter, sans-serif" font-size="11" font-weight="600">Refactor Redux Slices</text>
      <text x="20" y="98" fill="#64748b" font-family="Inter, sans-serif" font-size="9">⚡ 5 pts · Due Tomorrow</text>

      <!-- Task Card 2 -->
      <rect x="10" y="122" width="196" height="74" rx="6" fill="#111a33" stroke="rgba(255, 255, 255, 0.06)" />
      <rect x="20" y="132" width="38" height="14" rx="3" fill="#f59e0b" opacity="0.2" />
      <text x="39" y="143" fill="#f59e0b" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">TEST</text>
      <text x="20" y="162" fill="#ffffff" font-family="Inter, sans-serif" font-size="11" font-weight="600">E2E Cypress Tests</text>
      <text x="20" y="182" fill="#64748b" font-family="Inter, sans-serif" font-size="9">⚡ 3 pts · Sep 8</text>

      <!-- Col 2: In Progress -->
      <rect x="234" y="0" width="216" height="300" rx="8" fill="#080c1b" stroke="rgba(255, 255, 255, 0.05)" />
      <text x="248" y="24" fill="#38bdf8" font-family="Inter, sans-serif" font-size="11" font-weight="bold">IN PROGRESS (2)</text>

      <rect x="244" y="38" width="196" height="74" rx="6" fill="#122044" stroke="rgba(56, 189, 248, 0.3)" />
      <rect x="254" y="48" width="44" height="14" rx="3" fill="#818cf8" opacity="0.2" />
      <text x="276" y="59" fill="#818cf8" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">DESIGN</text>
      <text x="254" y="78" fill="#ffffff" font-family="Inter, sans-serif" font-size="11" font-weight="600">Framer Motion Transition</text>
      <text x="254" y="98" fill="#38bdf8" font-family="Inter, sans-serif" font-size="9">⚡ Active Sprint · Sheik</text>

      <!-- Col 3: Done -->
      <rect x="468" y="0" width="216" height="300" rx="8" fill="#080c1b" stroke="rgba(255, 255, 255, 0.05)" />
      <text x="482" y="24" fill="#10b981" font-family="Inter, sans-serif" font-size="11" font-weight="bold">COMPLETED (6)</text>

      <rect x="478" y="38" width="196" height="74" rx="6" fill="#111a33" opacity="0.7" />
      <text x="488" y="72" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11" text-decoration="line-through">Setup Vite + Tailwind</text>
      <text x="488" y="94" fill="#10b981" font-family="Inter, sans-serif" font-size="9">✓ Merged &amp; Verified</text>
    </g>
  </g>
</svg>
