<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="apiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c1a" />
      <stop offset="50%" stop-color="#0a1226" />
      <stop offset="100%" stop-color="#050816" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#apiBg)" />
  <rect x="1" y="1" width="798" height="498" rx="15" stroke="rgba(168, 85, 247, 0.25)" stroke-width="1.5" />

  <g transform="translate(35, 35)">
    <rect width="730" height="430" rx="12" fill="#090e1f" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    <path d="M 0 38 L 730 38" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    <circle cx="20" cy="19" r="4.5" fill="#ef4444" />
    <circle cx="36" cy="19" r="4.5" fill="#f59e0b" />
    <circle cx="52" cy="19" r="4.5" fill="#10b981" />
    <text x="365" y="23" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">api-lens.io · React.js + Axios + REST Query Engine</text>

    <!-- Request Bar -->
    <g transform="translate(24, 56)">
      <rect x="0" y="0" width="80" height="34" rx="6" fill="#10b981" opacity="0.2" stroke="#10b981" stroke-width="1" />
      <text x="40" y="22" fill="#10b981" font-family="'JetBrains Mono', monospace" font-weight="bold" font-size="12" text-anchor="middle">GET</text>

      <rect x="90" y="0" width="500" height="34" rx="6" fill="#11182c" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
      <text x="106" y="22" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="11">https://api.vortex.dev/v2/telemetry/nodes?status=active</text>

      <rect x="600" y="0" width="82" height="34" rx="6" fill="#38bdf8" />
      <text x="641" y="22" fill="#050816" font-family="Inter, sans-serif" font-weight="bold" font-size="11" text-anchor="middle">SEND ⚡</text>
    </g>

    <!-- Response Panel -->
    <g transform="translate(24, 108)">
      <rect x="0" y="0" width="682" height="294" rx="8" fill="#060914" stroke="rgba(255, 255, 255, 0.06)" />
      
      <!-- Panel Header -->
      <path d="M 0 34 L 682 34" stroke="rgba(255, 255, 255, 0.06)" />
      <text x="20" y="22" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11">STATUS: 200 OK</text>
      <text x="160" y="22" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">TIME: 64ms</text>
      <text x="280" y="22" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">SIZE: 3.42 KB</text>

      <!-- Code Body -->
      <g transform="translate(20, 56)" font-family="'JetBrains Mono', monospace" font-size="11">
        <text x="0" y="0" fill="#94a3b8">{</text>
        <text x="20" y="22" fill="#38bdf8">"success"<tspan fill="#94a3b8">: </tspan><tspan fill="#a855f7">true</tspan><tspan fill="#94a3b8">,</tspan></text>
        <text x="20" y="44" fill="#38bdf8">"latencyMs"<tspan fill="#94a3b8">: </tspan><tspan fill="#10b981">64</tspan><tspan fill="#94a3b8">,</tspan></text>
        <text x="20" y="66" fill="#38bdf8">"clusters"<tspan fill="#94a3b8">: [</tspan></text>
        <text x="40" y="88" fill="#94a3b8">{</text>
        <text x="60" y="110" fill="#38bdf8">"id"<tspan fill="#94a3b8">: </tspan><tspan fill="#f59e0b">"node-us-east-01"</tspan><tspan fill="#94a3b8">,</tspan></text>
        <text x="60" y="132" fill="#38bdf8">"healthy"<tspan fill="#94a3b8">: </tspan><tspan fill="#a855f7">true</tspan><tspan fill="#94a3b8">,</tspan></text>
        <text x="60" y="154" fill="#38bdf8">"cpuUtilization"<tspan fill="#94a3b8">: </tspan><tspan fill="#10b981">41.8</tspan><tspan fill="#94a3b8">,</tspan></text>
        <text x="60" y="176" fill="#38bdf8">"activeConnections"<tspan fill="#94a3b8">: </tspan><tspan fill="#10b981">1420</tspan></text>
        <text x="40" y="198" fill="#94a3b8">}</text>
        <text x="20" y="220" fill="#94a3b8">]</text>
        <text x="0" y="242" fill="#94a3b8">}</text>
      </g>
    </g>
  </g>
</svg>
