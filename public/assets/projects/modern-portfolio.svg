<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="portBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816" />
      <stop offset="50%" stop-color="#0a122c" />
      <stop offset="100%" stop-color="#050816" />
    </linearGradient>
    <linearGradient id="portGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#portBg)" />
  <rect x="1" y="1" width="798" height="498" rx="15" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5" />

  <!-- Frame -->
  <g transform="translate(35, 35)">
    <rect width="730" height="430" rx="12" fill="#080e22" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    <path d="M 0 38 L 730 38" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    <circle cx="20" cy="19" r="4.5" fill="#ef4444" />
    <circle cx="36" cy="19" r="4.5" fill="#f59e0b" />
    <circle cx="52" cy="19" r="4.5" fill="#10b981" />
    <text x="365" y="23" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">react-portfolio.site · Vite + Framer Motion</text>

    <!-- Mini Mockup of Portfolio Hero -->
    <g transform="translate(40, 65)">
      <!-- Pill -->
      <rect x="0" y="0" width="160" height="22" rx="11" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.4)" />
      <text x="80" y="15" fill="#38bdf8" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">REACT.JS DEVELOPER</text>

      <!-- Headline -->
      <text x="0" y="55" fill="#ffffff" font-family="Inter, sans-serif" font-size="28" font-weight="900">SHEIK ABDULLA S</text>
      <text x="0" y="88" fill="url(#portGlow)" font-family="Inter, sans-serif" font-size="24" font-weight="800">REACT.JS &amp; JAVASCRIPT</text>

      <text x="0" y="120" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11">Frontend developer building high-performance modern web apps</text>

      <!-- Buttons -->
      <rect x="0" y="140" width="110" height="30" rx="15" fill="url(#portGlow)" />
      <text x="55" y="159" fill="#ffffff" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">CONTACT ME</text>

      <rect x="120" y="140" width="110" height="30" rx="15" fill="#172342" stroke="rgba(255, 255, 255, 0.1)" />
      <text x="175" y="159" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">DOWNLOAD CV</text>

      <!-- Mini badges -->
      <g transform="translate(0, 195)">
        <rect x="0" y="0" width="60" height="18" rx="9" fill="#101935" stroke="rgba(56, 189, 248, 0.3)" />
        <text x="30" y="12" fill="#38bdf8" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">React.js</text>

        <rect x="68" y="0" width="68" height="18" rx="9" fill="#101935" stroke="rgba(56, 189, 248, 0.3)" />
        <text x="102" y="12" fill="#38bdf8" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">JavaScript</text>

        <rect x="144" y="0" width="50" height="18" rx="9" fill="#101935" stroke="rgba(56, 189, 248, 0.3)" />
        <text x="169" y="12" fill="#38bdf8" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Vite</text>

        <rect x="202" y="0" width="76" height="18" rx="9" fill="#101935" stroke="rgba(56, 189, 248, 0.3)" />
        <text x="240" y="12" fill="#38bdf8" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Tailwind CSS</text>
      </g>
    </g>

    <!-- Right Side: Mini Editor Preview -->
    <g transform="translate(420, 60)">
      <rect width="250" height="270" rx="10" fill="#040714" stroke="rgba(129, 140, 248, 0.3)" />
      <path d="M 0 28 L 250 28" stroke="rgba(255, 255, 255, 0.06)" />
      <circle cx="16" cy="14" r="3.5" fill="#ef4444" />
      <circle cx="28" cy="14" r="3.5" fill="#f59e0b" />
      <circle cx="40" cy="14" r="3.5" fill="#10b981" />
      <text x="140" y="18" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">Developer.jsx</text>

      <g transform="translate(16, 48)" font-family="'JetBrains Mono', monospace" font-size="9">
        <text x="0" y="0" fill="#a855f7">const <tspan fill="#38bdf8">developer</tspan> = {</text>
        <text x="12" y="18" fill="#cbd5e1">role: <tspan fill="#10b981">"React.js Dev"</tspan>,</text>
        <text x="12" y="36" fill="#cbd5e1">focus: <tspan fill="#10b981">"Modern Frontend"</tspan>,</text>
        <text x="12" y="54" fill="#cbd5e1">skills: [</text>
        <text x="24" y="72" fill="#10b981">"React.js",</text>
        <text x="24" y="90" fill="#10b981">"JavaScript",</text>
        <text x="24" y="108" fill="#10b981">"Tailwind CSS"</text>
        <text x="12" y="126" fill="#cbd5e1">],</text>
        <text x="12" y="144" fill="#cbd5e1">status: <tspan fill="#a855f7">true</tspan></text>
        <text x="0" y="162" fill="#a855f7">};</text>
      </g>
    </g>
  </g>
</svg>
