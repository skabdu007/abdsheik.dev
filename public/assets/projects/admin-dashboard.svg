      <text x="194" y="48" fill="#ffffff" font-family="Inter, sans-serif" font-size="18" font-weight="bold">1,842</text>
      <text x="194" y="64" fill="#38bdf8" font-family="Inter, sans-serif" font-size="9">384 live right now</text>

      <rect x="360" y="0" width="164" height="74" rx="8" fill="#0f172a" stroke="rgba(255, 255, 255, 0.06)" />
