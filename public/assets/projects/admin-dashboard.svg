<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="dashBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c1b" />
      <stop offset="50%" stop-color="#0c142c" />
      <stop offset="100%" stop-color="#050816" />
    </linearGradient>
    <linearGradient id="dashAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#dashBg)" />
  <rect x="1" y="1" width="798" height="498" rx="15" stroke="rgba(129, 140, 248, 0.2)" stroke-width="1.5" />

  <!-- App Frame -->
  <g transform="translate(35, 35)">
