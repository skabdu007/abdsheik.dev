    <circle cx="20" cy="19" r="4.5" fill="#ef4444" />
    <circle cx="36" cy="19" r="4.5" fill="#f59e0b" />
    <circle cx="52" cy="19" r="4.5" fill="#10b981" />
    <text x="365" y="23" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">admin-console.internal · React Router + Tailwind</text>

    <!-- Sidebar -->
    <rect x="0" y="38" width="160" height="392" fill="#070b18" />
    <path d="M 160 38 L 160 430" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" />
    
    <!-- Sidebar Items -->
    <rect x="12" y="58" width="136" height="30" rx="6" fill="#1e293b" />
    <text x="36" y="78" fill="#38bdf8" font-family="Inter, sans-serif" font-size="11" font-weight="600">📊 Overview</text>
    <text x="36" y="112" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11">👥 Customers</text>
    <text x="36" y="146" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11">📦 Inventory</text>
