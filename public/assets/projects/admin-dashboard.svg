      <!-- Chart line and points -->
      <polyline points="30,210 90,185 160,195 230,150 300,165 380,130 450,140 500,115" fill="none" stroke="#38bdf8" stroke-width="3" />
      <polygon points="30,210 90,185 160,195 230,150 300,165 380,130 450,140 500,115 500,225 30,225" fill="#38bdf8" opacity="0.1" />
      <circle cx="500" cy="115" r="4.5" fill="#38bdf8" />

      <!-- Data Table Preview -->
      <rect x="0" y="254" width="524" height="100" rx="8" fill="#0e162d" stroke="rgba(255, 255, 255, 0.06)" />
      <text x="16" y="274" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10">ORDER ID</text>
      <text x="120" y="274" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10">CLIENT</text>
      <text x="260" y="274" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10">STATUS</text>
      <text x="440" y="274" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10">AMOUNT</text>

      <text x="16" y="298" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">#ORD-9024</text>
      <text x="120" y="298" fill="#ffffff" font-family="Inter, sans-serif" font-size="10">Acme Global</text>
      <text x="260" y="298" fill="#10b981" font-family="Inter, sans-serif" font-size="10">● Completed</text>
      <text x="440" y="298" fill="#ffffff" font-family="Inter, sans-serif" font-size="10 font-weight=bold">$2,840.00</text>

      <text x="16" y="324" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">#ORD-9025</text>
      <text x="120" y="324" fill="#ffffff" font-family="Inter, sans-serif" font-size="10">Apex Labs Inc</text>
      <text x="260" y="324" fill="#f59e0b" font-family="Inter, sans-serif" font-size="10">● Processing</text>
      <text x="440" y="324" fill="#ffffff" font-family="Inter, sans-serif" font-size="10 font-weight=bold">$1,290.00</text>
