      <text x="14" y="48" fill="#ffffff" font-family="Inter, sans-serif" font-size="18" font-weight="bold">$128,450</text>
      <text x="14" y="64" fill="#10b981" font-family="Inter, sans-serif" font-size="9">+18.4% vs last month</text>

      <rect x="180" y="0" width="164" height="74" rx="8" fill="#0f172a" stroke="rgba(255, 255, 255, 0.06)" />
