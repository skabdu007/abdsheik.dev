<svg width="800" height="480" viewBox="0 0 800 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="480" fill="#090D1A"/>
  <circle cx="400" cy="150" r="250" fill="url(#erp_glow)" opacity="0.4"/>
  
  <!-- Grid background -->
  <path d="M0 60H800M0 120H800M0 180H800M0 240H800M0 300H800M0 360H800M0 420H800" stroke="#1E293B" stroke-opacity="0.4" stroke-width="1"/>
  <path d="M100 0V480M200 0V480M300 0V480M400 0V480M500 0V480M600 0V480M700 0V480" stroke="#1E293B" stroke-opacity="0.4" stroke-width="1"/>
  
  <!-- Dashboard Window -->
  <rect x="60" y="50" width="680" height="380" rx="14" fill="#0B1120" stroke="#334155" stroke-opacity="0.6" stroke-width="1.5"/>
  <rect x="60" y="50" width="680" height="42" rx="14" fill="#0E172A"/>
  
  <!-- Mac Window Dots -->
  <circle cx="88" cy="71" r="5" fill="#EF4444"/>
  <circle cx="106" cy="71" r="5" fill="#F59E0B"/>
  <circle cx="124" cy="71" r="5" fill="#10B981"/>
  <text x="146" y="75" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" font-weight="500">CloudFlow ERP — Warehouse Inventory &amp; Order Pipeline</text>
  
  <!-- Sidebar -->
  <rect x="60" y="92" width="160" height="338" fill="#080D1A" stroke="#1E293B" stroke-width="1"/>
  <rect x="76" y="116" width="128" height="28" rx="6" fill="#1E293B" fill-opacity="0.6"/>
  <text x="96" y="134" fill="#60A5FA" font-family="system-ui, sans-serif" font-size="11" font-weight="600">📊 Overview</text>
  <text x="96" y="172" fill="#64748B" font-family="system-ui, sans-serif" font-size="11">📦 Stock Ledger</text>
  <text x="96" y="206" fill="#64748B" font-family="system-ui, sans-serif" font-size="11">🧾 Tax Invoicing</text>
  <text x="96" y="240" fill="#64748B" font-family="system-ui, sans-serif" font-size="11">🔄 Sync Workers</text>
  <text x="96" y="274" fill="#64748B" font-family="system-ui, sans-serif" font-size="11">⚙️ Settings</text>

  <!-- Metric Cards -->
  <rect x="240" y="112" width="145" height="74" rx="8" fill="#111B30" stroke="#1E293B"/>
